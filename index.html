<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <main>
    <div class="card">
      <img src="/assets/images/illustration-article.svg" alt="illustration-article" class="card-img">

      <div class="text-content">
        <h3 class="subtitle">
          Learning
        </h3>
        <p class="publication">
          Published 21 Dec 2023
        </p>
        <h2 class="title">
          HTML & CSS foundations
        </h2>
        <p class="desc">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>
      </div>

      <div class="user">
        <img src="/assets/images/image-avatar.webp" alt="user-avatar" class="user-avatar">
        <h3 class="user-nickname">
          Greg Hooper
        </h3>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">@IIIRNBY</a>.
  </footer>
</body>
</html>
